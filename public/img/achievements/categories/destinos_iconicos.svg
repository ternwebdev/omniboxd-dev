<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Fondo de pasaporte -->
  <rect x="14" y="14" width="100" height="100" rx="8" fill="#2553eb" stroke="#ffd700" stroke-width="4"/>
  <rect x="20" y="20" width="88" height="88" rx="6" fill="none" stroke="#fff" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Sellos de destinos -->
  <!-- Sello 1: Playa -->
  <circle cx="40" cy="60" r="14" fill="none" stroke="#ff0000" stroke-width="2" opacity="0.7"/>
  <path d="M 34 64 Q 40 60, 46 64" fill="none" stroke="#ff0000" stroke-width="1.5"/>
  <circle cx="44" cy="56" r="3" fill="#ffd700" opacity="0.7"/>
  
  <!-- Sello 2: Ciudad -->
  <circle cx="70" cy="58" r="14" fill="none" stroke="#146321" stroke-width="2" opacity="0.7"/>
  <rect x="64" y="52" width="4" height="10" fill="#146321" opacity="0.7"/>
  <rect x="70" y="48" width="4" height="14" fill="#146321" opacity="0.7"/>
  <rect x="76" y="54" width="4" height="8" fill="#146321" opacity="0.7"/>
  
  <!-- Sello 3: Montaña -->
  <circle cx="50" cy="86" r="14" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.7"/>
  <path d="M 44 90 L 50 80 L 56 90 Z" fill="#ffd700" opacity="0.7"/>
  
  <!-- Sello 4: Frontera -->
  <circle cx="80" cy="84" r="14" fill="none" stroke="#ff0000" stroke-width="2" opacity="0.7"/>
  <line x1="74" y1="84" x2="86" y2="84" stroke="#ff0000" stroke-width="2" opacity="0.7"/>
  
  <!-- Ómnibus pequeño -->
  <rect x="54" y="100" width="20" height="8" rx="1" fill="#fff" opacity="0.8"/>
  <circle cx="58" cy="110" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="70" cy="110" r="2" fill="#fff" opacity="0.8"/>
</svg>