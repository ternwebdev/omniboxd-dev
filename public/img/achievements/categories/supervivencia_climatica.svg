  <!-- Escudo interior -->
  <path d="M 64 28 L 96 40 L 96 68 Q 96 90, 64 104 Q 32 90, 32 68 L 32 40 Z" fill="#fff" stroke="#ff0000" stroke-width="2"/>
  
  <!-- 4 elementos climáticos en los cuadrantes -->
