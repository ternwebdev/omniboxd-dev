  <line x1="64" y1="32" x2="64" y2="36" stroke="#ffd700" stroke-width="2"/>
  <line x1="64" y1="52" x2="64" y2="56" stroke="#ffd700" stroke-width="2"/>
  <line x1="52" y1="44" x2="56" y2="44" stroke="#ffd700" stroke-width="2"/>
  <line x1="72" y1="44" x2="76" y2="44" stroke="#ffd700" stroke-width="2"/>
  
  <!-- Lluvia (derecha) -->
  <path d="M 82 64 Q 82 58, 88 58 Q 94 58, 94 64 L 94 66 L 82 66 Z" fill="#2553eb"/>
  <line x1="85" y1="68" x2="84" y2="74" stroke="#2553eb" stroke-width="1.5"/>
