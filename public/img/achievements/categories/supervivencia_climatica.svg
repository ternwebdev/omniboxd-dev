  <line x1="91" y1="68" x2="90" y2="74" stroke="#2553eb" stroke-width="1.5"/>
  
  <!-- Nieve (abajo) -->
  <line x1="64" y1="82" x2="64" y2="92" stroke="#2553eb" stroke-width="2"/>
  <line x1="59" y1="85" x2="69" y2="89" stroke="#2553eb" stroke-width="2"/>
  <line x1="59" y1="89" x2="69" y2="85" stroke="#2553eb" stroke-width="2"/>
  <circle cx="64" cy="82" r="1.5" fill="#2553eb"/>
  <circle cx="64" cy="92" r="1.5" fill="#2553eb"/>
  
  <!-- Viento (izquierda) -->
  <path d="M 38 64 Q 44 60, 50 64 Q 44 68, 38 64" fill="none" stroke="#146321" stroke-width="2"/>
  <path d="M 40 70 Q 46 66, 52 70" fill="none" stroke="#146321" stroke-width="2"/>
  <path d="M 36 76 Q 42 72, 48 76" fill="none" stroke="#146321" stroke-width="2"/>
  
  <!-- Check central -->
  <circle cx="64" cy="64" r="12" fill="#146321"/>
  <path d="M 58 64 L 62 68 L 70 60" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
