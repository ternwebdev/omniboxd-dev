<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Fondo circular -->
  <circle cx="64" cy="64" r="60" fill="#fff" stroke="#ffd700" stroke-width="4"/>
  
  <!-- Reloj grande -->
  <circle cx="64" cy="60" r="40" fill="#fff" stroke="#2553eb" stroke-width="3"/>
  <circle cx="64" cy="60" r="36" fill="none" stroke="#94a3b8" stroke-width="1"/>
  
  <!-- Divisiones de horario (4 cuadrantes de colores) -->
  <path d="M 64 24 L 64 60 L 100 60 A 36 36 0 0 0 64 24 Z" fill="#ffd700" opacity="0.3"/>
  <path d="M 100 60 L 64 60 L 64 96 A 36 36 0 0 0 100 60 Z" fill="#ff0000" opacity="0.3"/>
  <path d="M 64 96 L 64 60 L 28 60 A 36 36 0 0 0 64 96 Z" fill="#146321" opacity="0.3"/>
  <path d="M 28 60 L 64 60 L 64 24 A 36 36 0 0 0 28 60 Z" fill="#2553eb" opacity="0.3"/>
  
  <!-- Manecillas -->
  <line x1="64" y1="60" x2="64" y2="36" stroke="#ff0000" stroke-width="3" stroke-linecap="round"/>
  <line x1="64" y1="60" x2="84" y2="60" stroke="#2553eb" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="64" cy="60" r="4" fill="#ffd700"/>
  
  <!-- Íconos de momentos del día alrededor -->
  <!-- Sol (mañana) -->
  <circle cx="20" cy="30" r="6" fill="#ffd700"/>
  <line x1="20" y1="20" x2="20" y2="24" stroke="#ffd700" stroke-width="2"/>
  <line x1="20" y1="36" x2="20" y2="40" stroke="#ffd700" stroke-width="2"/>
  <line x1="10" y1="30" x2="14" y2="30" stroke="#ffd700" stroke-width="2"/>
  <line x1="26" y1="30" x2="30" y2="30" stroke="#ffd700" stroke-width="2"/>
  
  <!-- Luna (noche) -->
  <path d="M 108 30 Q 102 30, 102 36 Q 102 42, 108 42 Q 104 38, 104 34 Q 104 32, 108 30 Z" fill="#2553eb"/>
  
  <!-- Amanecer (tarde) -->
  <path d="M 16 100 Q 24 94, 32 100" fill="none" stroke="#ff0000" stroke-width="2"/>
  <circle cx="24" cy="96" r="4" fill="#ffd700"/>
  
  <!-- Estrella (madrugada) -->
  <path d="M 104 100 L 106 96 L 108 100 L 104 102 Z" fill="#ffd700"/>
</svg>