  <line x1="32" y1="40" x2="32" y2="56" stroke="#475569" stroke-width="1.5"/>
  <!-- Páginas con líneas de texto (representando conocimiento) -->
  <line x1="12" y1="44" x2="28" y2="44" stroke="#CBD5E1" stroke-width="1"/>
  <line x1="12" y1="47" x2="28" y2="47" stroke="#CBD5E1" stroke-width="1"/>
  <line x1="12" y1="50" x2="28" y2="50" stroke="#CBD5E1" stroke-width="1"/>
  <line x1="36" y1="44" x2="52" y2="44" stroke="#CBD5E1" stroke-width="1"/>
  <line x1="36" y1="47" x2="52" y2="47" stroke="#CBD5E1" stroke-width="1"/>
  <line x1="36" y1="50" x2="52" y2="50" stroke="#CBD5E1" stroke-width="1"/>
  <!-- Ómnibus saliendo del libro -->
  <rect x="20" y="22" width="24" height="12" rx="2" fill="#ffd700"/>
  <rect x="20" y="30" width="24" height="4" fill="#2553eb"/>
  <rect x="23" y="25" width="4" height="4" rx="0.5" fill="#DBEAFE"/>
  <rect x="29" y="25" width="4" height="4" rx="0.5" fill="#DBEAFE"/>
  <rect x="35" y="25" width="4" height="4" rx="0.5" fill="#DBEAFE"/>
  <circle cx="26" cy="36" r="2.5" fill="#1E3A5F"/>
  <circle cx="38" cy="36" r="2.5" fill="#1E3A5F"/>
  <!-- Líneas de movimiento/rutas saliendo del libro -->
  <path d="M 14 30 Q 10 20, 6 14" fill="none" stroke="#ff0000" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 50 30 Q 54 20, 58 14" fill="none" stroke="#2553eb" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 32 22 L 32 12" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Estrellitas de conocimiento -->
  <circle cx="10" cy="12" r="1.5" fill="#ffd700"/>
  <circle cx="54" cy="10" r="1.5" fill="#ffd700"/>
  <circle cx="32" cy="8" r="1.5" fill="#ffd700"/>
</svg>